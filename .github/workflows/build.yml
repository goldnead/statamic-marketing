name: build

# Kein COMPOSER_AUTH: seit 01.08.2026 sind alle goldnead-Geschwister oeffentlich und
# liegen auf Packagist, Composer laedt sie also anonym. Die fruehere Zeile setzte
# github-oauth auf SIBLING_REPOS_TOKEN mit Rueckfall auf github.token. Weil dieser
# Workflow permissions: {} setzt, hat der Rueckfall keine Scopes -- Composer versuchte
# daraufhin JEDEN dist-Download zu authentifizieren und starb an
# "Could not authenticate against github.com", auch bei fremden Paketen.
# Ein leeres Credential ist schlechter als gar keins.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest

    name: Frontend (Vite + Vue 3)

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      # The Statamic 6 Vite convention pulls @statamic/cms from the installed
      # Composer package (a `file:` npm dependency), so Composer must run first.
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

      - name: Verify build output
        run: |
          test -f resources/dist/build/manifest.json
          echo "✓ manifest present:"
          cat resources/dist/build/manifest.json

      - name: Upload build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cp-assets-${{ github.sha }}
          path: resources/dist/build/
          retention-days: 14
          if-no-files-found: error
