name: build-check

# Fails the build if the committed resources/dist bundle is stale.
# resources/dist is shipped via Composer (no npm at install time), so it must
# always match current source. See scripts/check-dist-fresh.sh.
#
# The three hard siblings are private VCS repositories that Composer clones on
# its own, so it gets its own credentials below rather than a checkout beside
# this one.

# Kein COMPOSER_AUTH: seit 01.08.2026 sind alle goldnead-Geschwister oeffentlich und
# liegen auf Packagist, Composer laedt sie also anonym. Die fruehere Zeile setzte
# github-oauth auf SIBLING_REPOS_TOKEN mit Rueckfall auf github.token. Weil dieser
# Workflow permissions: {} setzt, hat der Rueckfall keine Scopes -- Composer versuchte
# daraufhin JEDEN dist-Download zu authentifizieren und starb an
# "Could not authenticate against github.com", auch bei fremden Paketen.
# Ein leeres Credential ist schlechter als gar keins.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dist-fresh:
    runs-on: ubuntu-latest
    name: Committed dist is fresh (npm ci + build diff)
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      # @statamic/cms is a `file:` npm dependency resolved from the installed
      # Composer package, so Composer must run before npm.
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies (reproducible)
        run: npm ci

      # The node_modules this job already installed are all Vitest needs, so
      # the component tests run here rather than in a job of their own.
      - name: Run the Control Panel component tests
        run: npm test

      - name: Verify committed resources/dist is fresh
        run: npm run build:check
