<style>

  .body ul,.body ol{margin:0 0 14px;padding-left:22px;font-size:15px;line-height:1.6;color:#4a4038;}
  .body li{margin:6px 0 0;}
  .body a{color:#A24A2A;text-decoration:underline;}
  .body img{max-width:100%;}
</style>
</head>

{{ content }}
